name: Production Docker CI Pipeline

# Trigger this workflow every time code is pushed to the 'main' branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Docker Image & Run Tests
    runs-on: ubuntu-latest 

    steps:
    # Step 1: Check out the repository code onto the runner server
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Prepare Python environment on the CI runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # # Step 3: Dynamically create the .env file on the CI runner
    # - name: Create .env file for Docker Compose
    #   run: |
    #     echo "DATABASE_URL=postgresql://postgres1:postgrespassword@db:5432/enterprisedb" >> .env
    #     echo "POSTGRES_USER=postgres1" >> .env
    #     echo "POSTGRES_PASSWORD=postgrespassword" >> .env
    #     echo "POSTGRES_DB=enterprisedb" >> .env
    #     echo "REDIS_UR=redis://redis:6379/0" >> .env
    #     cat .env

    # Step 4: Install test dependencies using requirements-dev.txt
    - name: Install Test Dependencies
      run: pip install -r app/requirements-dev.txt

    # Step 5: Set up the Docker Buildx engine (enables advanced caching)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 6: Build the images using Buildx cache backend

    - name: Build Docker Compose Images
      env:
        DOCKER_BUILDKIT: 1
      run: |
        docker compose down -v
        docker compose build



    # Step 7: Start the application using Docker Compose
    - name: Start Docker Compose
      run: docker compose up -d

    # Step 8: Run pytest (conftest.py checks the URL, then test_auth.py runs)
    - name: Run Integration Tests
      run: |
          pytest -v tests/

    # Step 9: Print Docker logs IF the workflow fails
    - name: Print Container Logs on Failure
      if: failure()
      run: docker compose logs


  