name: Production Docker CI Pipeline

# Trigger this workflow every time code is pushed to the 'main' branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Docker Image & Run Tests
    runs-on: ubuntu-latest 

    steps:
    # Step 1: Check out the repository code onto the runner server
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Set up the Docker Buildx engine (enables advanced caching)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 3: Build the images using Buildx cache backend

    - name: Build Docker Compose Images
      env:
        DOCKER_BUILDKIT: 1
      run: docker compose build

    # Step 4: Start the application using Docker Compose
    - name: Start Docker Compose
      env:
        POSTGRES_USER: citestuser
        POSTGRES_PASSWORD: citestpassword123
        POSTGRES_DB: enterprise_db
        REDIS_HOST: redis
        DATABASE_URL: postgresql://citestuser:citestpassword123@db:5432/enterprise_db
      run: docker compose up -d

    # # Step 5: Verify running containers
    # - name: Check running containers
    #   run: |
    #       echo "Checking web availability..."
    #       for i in {1..15}; do
    #         if curl -f -X POST "http://localhost:8000/trigger-job?name=CITestJob" | grep -q "Task submitted to background queue"; then
    #           echo "Web is up and responding!"
    #           exit 0
    #         fi
    #         echo "Attempt $i: Web not ready yet. Retrying in 2s..."
    #         sleep 2
    #       done
    #       echo "Web failed to respond in time."
    #       docker compose logs
    #       exit 1

    # Step 6: Wait for API Gateway to respond
    - name: Wait for Web Application to Respond
      run: |
        echo "Checking Web app readiness..."
        for i in {1..15}; do
          if curl -s http://localhost/ | grep -q "healthy"; then
            echo "✅ Web app is up and responding!"
            break
          fi
          echo "Waiting for Web app... retrying in 2 seconds."
          sleep 2
        done

