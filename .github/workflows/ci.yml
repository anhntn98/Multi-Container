name: Production Docker CI Pipeline

# Trigger this workflow every time code is pushed to the 'main' branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Docker Image & Run Tests
    runs-on: ubuntu-latest 

    steps:
    # Step 1: Check out the repository code onto the runner server
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Prepare Python environment on the CI runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Step 3: Install test dependencies using requirements-dev.txt
    - name: Install Test Dependencies
      run: pip install -r app/requirements-dev.txt

    # Step 4: Set up the Docker Buildx engine (enables advanced caching)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 5: Build the images using Buildx cache backend

    - name: Build Docker Compose Images
      env:
        DOCKER_BUILDKIT: 1
      run: docker compose build

    # Step 6: Start the application using Docker Compose
    - name: Start Docker Compose
      env:
        POSTGRES_USER: citestuser
        POSTGRES_PASSWORD: citestpassword123
        POSTGRES_DB: enterprise_db
        REDIS_HOST: redis
        DATABASE_URL: postgresql://citestuser:citestpassword123@db:5432/enterprise_db
      run: docker compose up -d

    # Step 6: Run pytest (conftest.py checks the URL, then test_auth.py runs)
    - name: Run Integration Tests
      run: pytest tests/ -v

  