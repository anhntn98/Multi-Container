name: Production Docker CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: devops-lab-app

jobs:
  build-and-test:
    name: Build Docker Image & Run Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Prepare Python environment for pytest
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install test dependencies
      - name: Install Test Dependencies
        run: pip install -r app/requirements-dev.txt

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build Docker images
      - name: Build Docker Compose Images
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker compose down -v
          docker compose build

      # 6. Start containers
      - name: Start Docker Compose
        run: docker compose up -d

      # 7. Run integration tests
      - name: Run Integration Tests
        run: |
          pytest -v tests/

      # 8. Show logs if test/build fails
      - name: Print Container Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Debug OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            )
            console.log("aud:", payload.aud)
            console.log("sub:", payload.sub)
            console.log("ref:", payload.ref)
            console.log("repository:", payload.repository)
            console.log("repository_id:", payload.repository_id)
            console.log("repository_owner_id:", payload.repository_owner_id)

      # 9. Authenticate GitHub Actions with AWS
      # Only publish when code is actually pushed to master.
      # Pull requests only build + test.
      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::803872867747:role/ecr-permission
          aws-region: ${{ env.AWS_REGION }}

      # 10. Login Docker to ECR
      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/master'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Tag the SAME tested image with Git commit SHA and push to ECR
      - name: Tag and Push Image to ECR
        if: github.ref == 'refs/heads/master'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag multi-container-web:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 12. Cleanup CI containers
      - name: Cleanup Docker Compose
        if: always()
        run: docker compose down -v
