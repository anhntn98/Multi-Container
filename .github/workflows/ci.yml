name: Production Docker CI Pipeline

# Trigger this workflow every time code is pushed to the 'main' branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Docker Image & Run Tests
    runs-on: ubuntu-latest 

    steps:
    # Step 1: Check out the repository code onto the runner server
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Set up the Docker Buildx engine (enables advanced caching)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 3: Build the images using Buildx cache backend

    - name: Build Docker Compose Images
      env:
        DOCKER_BUILDKIT: 1
      run: docker compose build

    # Step 4: Start the application using Docker Compose
    - name: Start Docker Compose
      run: docker compose up -d

    # Step 5: Verify running containers
    - name: Check running containers
      run: |
          echo "Checking web availability..."
          for i in {1..15}; do
            if curl -f -X POST "http://localhost/trigger-job?name=CITestJob" | grep -q "CITestJob"; then
              echo "Web is up and responding!"
              exit 0
            fi
            echo "Attempt $i: Web not ready yet. Retrying in 2s..."
            sleep 2
          done
          echo "Web failed to respond in time."
          docker compose logs
          exit 1

