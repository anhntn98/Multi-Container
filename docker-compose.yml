version: '3.8'

services:
  # 1. Reverse Proxy / Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: enterprise-gateway
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - frontend-net
    restart: always

  # 2. FastAPI Web API
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: enterprise-web
    env_file:
      - .env
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # 3. Celery Background Worker
  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: enterprise-worker
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    networks:
      - backend-net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: always

  # 4. Redis Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-net
    restart: always

  # 5. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: enterprise-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-net
    restart: always

# Persistent Data Storage
volumes:
  postgres_data:
    driver: local

# Multi-Tier Network Isolation
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge